name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # FIVEWIRE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # fwtest is where the cable model and the equaliser are actually
        # checked, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DFIVEWIRE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The three CPU checks. None of them touches a GPU: the cable's response,
      # the equaliser's design and the preset logic are all arithmetic, which
      # is most of what can actually be wrong in this plugin.
      #
      # NOT tools/verify.sh, and NOT --impulse or --ghost: those render real
      # frames through the real shaders and want a real GPU. The runner has
      # software GL only, where they are slow and — worse — would be measuring
      # a software rasteriser's idea of a bilinear fetch. They stay local.
      - name: The cable's response
        run: ./build/fwtest --kernel

      - name: The equaliser against the cable it inverts
        run: ./build/fwtest --eq

      - name: Factory presets against three host behaviours
        run: ./build/fwtest --presets

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: 5-wire-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
