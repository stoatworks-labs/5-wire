  <body>
    <main id="demo">
      <noscript>
        <h1>5-wire</h1>
        <p>
          An FFGL effect that puts a long run of VGA or RGBHV cable between your
          picture and the screen. Coax loses the square root of frequency, and
          that one fact gives you the soft picture, the streak behind every
          caption and the displaced ghost, all from the same curve. An equaliser
          at the far end brings the picture back and lifts the noise with it.
          Put the same filter at the amplifier end and the picture comes back
          without the noise.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/5-wire/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/5-wire/">Project page and downloads</a></li>
